spring.application.name=construction-management

spring.datasource.url=jdbc:h2:mem:constructiondb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=construction-management
info.app.description=Construction project and task management REST API
info.app.version=0.0.1-SNAPSHOT
