services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: constructiondb
      POSTGRES_USER: construction
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U construction -d constructiondb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/constructiondb
      DB_USERNAME: construction
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      PORT: 8080
    ports:
      - "${PORT:-8080}:8080"

volumes:
  postgres_data:
