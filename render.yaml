# Render Blueprint: creates a Docker web service and a managed PostgreSQL database.
# Free-tier notes: the web service sleeps when idle, and free PostgreSQL expires after 30 days.
services:
  - type: web
    name: construction-management-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: construction-management-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: construction-management-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: construction-management-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: construction-management-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: construction-management-db
          property: password

databases:
  - name: construction-management-db
    databaseName: constructiondb
    user: construction
    plan: free
    region: oregon
    postgresMajorVersion: '16'
    ipAllowList: []
